[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decent-kg"
version = "0.1.0"
description = "Bounded-disclosure evidence exchange for question answering over multi-owner knowledge graphs."
requires-python = ">=3.11"

[project.optional-dependencies]
data = ["pyarrow"]
llm = ["torch", "transformers", "bitsandbytes", "huggingface_hub"]
plots = ["matplotlib"]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
